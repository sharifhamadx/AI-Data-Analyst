name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch: # زر سحري لتشغيل البناء يدوياً من GitHub

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 جلب كود المشروع
        uses: actions/checkout@v4

      - name: ⚙️ إعداد بيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 تثبيت مكتبات الواجهة وبنائها
        working-directory: ./frontend
        run: |
          npm install
          npm run build
          npx cap sync android

      - name: ☕ إعداد بيئة Java للأندرويد
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🛠️ إصلاح صلاحيات ملفات Gradle
        working-directory: ./frontend/android
        run: chmod +x gradlew

      - name: 🏗️ بناء تطبيق الأندرويد (APK)
        working-directory: ./frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: 📤 استخراج التطبيق الجاهز للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: Renas-Wallet-App
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
